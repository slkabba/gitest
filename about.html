<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>About — Hello, World!</title>
    <style>
      :root { color-scheme: dark; --ink:#eff4ff; --muted:#aeb9d4; --violet:#a78bfa; --cyan:#4de7e2; }
      * { box-sizing: border-box; }
      body { min-height:100vh; margin:0; display:grid; place-items:center; padding:2rem; overflow:hidden; background:radial-gradient(circle at 15% 20%,#402b84 0,transparent 28rem),radial-gradient(circle at 85% 75%,#075c6f 0,transparent 30rem),#0b1020; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
      main { width:min(92vw,46rem); padding:clamp(2rem,7vw,4.75rem); text-align:center; border:1px solid rgba(255,255,255,.18); border-radius:2rem; background:rgba(13,19,39,.58); box-shadow:0 2rem 5rem rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08); backdrop-filter:blur(18px); animation:enter .8s both; }
      .eyebrow { color:var(--cyan); font-size:.78rem; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }
      h1 { margin:.7rem 0 0; font-size:clamp(3rem,9vw,5.5rem); letter-spacing:-.065em; line-height:1; background:linear-gradient(110deg,#fff,#c6bdff 52%,#78f4ed); -webkit-background-clip:text; background-clip:text; color:transparent; }
      p { max-width:32rem; margin:1.5rem auto 0; color:var(--muted); font-size:1.1rem; line-height:1.7; }
      nav { display:flex; justify-content:center; gap:.4rem; margin-top:2rem; } nav a { padding:.65rem .95rem; border-radius:999px; color:var(--ink); font-size:.9rem; font-weight:700; text-decoration:none; transition:.2s; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.12); transform:translateY(-2px); }
      @keyframes enter { from { opacity:0; transform:translateY(1.5rem) scale(.98); } to { opacity:1; transform:none; } }
      @media (prefers-reduced-motion:reduce) { * { animation-duration:.01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">About this space</div>
      <h1>Made to begin.</h1>
      <p>This is a calm corner of the internet for ideas, experiments, and things worth making. Every great project starts with a small, bright first step.</p>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html" aria-current="page">About</a><a href="contact.html">Contact</a></nav>
    </main>
  </body>
</html>
