<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eff4ff;
        --muted: #aeb9d4;
        --violet: #a78bfa;
        --cyan: #4de7e2;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 15% 20%, #402b84 0, transparent 28rem),
          radial-gradient(circle at 85% 75%, #075c6f 0, transparent 30rem),
          #0b1020;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .orb {
        position: fixed;
        width: 18rem;
        height: 18rem;
        border-radius: 50%;
        filter: blur(1px);
        opacity: .45;
        animation: drift 12s ease-in-out infinite alternate;
        background: linear-gradient(135deg, var(--violet), transparent 65%);
      }
      .orb--one { top: -7rem; right: -5rem; }
      .orb--two { bottom: -9rem; left: -4rem; animation-delay: -6s; background: linear-gradient(135deg, var(--cyan), transparent 65%); }

      main {
        width: min(92vw, 46rem);
        padding: clamp(2rem, 7vw, 4.75rem);
        text-align: center;
        border: 1px solid rgba(255,255,255,.18);
        border-radius: 2rem;
        background: rgba(13, 19, 39, .58);
        box-shadow: 0 2rem 5rem rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.08);
        backdrop-filter: blur(18px);
        animation: enter .8s cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: .55rem;
        margin: 0 0 1.25rem;
        color: var(--cyan);
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      .eyebrow::before { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 1rem currentColor; }

      h1 {
        margin: 0;
        font-size: clamp(3.25rem, 11vw, 6.8rem);
        line-height: .92;
        letter-spacing: -.075em;
        background: linear-gradient(110deg, #fff 15%, #c6bdff 45%, #78f4ed 85%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { max-width: 31rem; margin: 1.5rem auto 0; color: var(--muted); font-size: clamp(1rem, 2.4vw, 1.18rem); line-height: 1.65; }
      .spark { color: var(--violet); }
      nav { display: flex; justify-content: center; gap: .4rem; margin-top: 2rem; }
      nav a { padding: .65rem .95rem; border-radius: 999px; color: var(--ink); font-size: .9rem; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
      nav a:hover, nav a[aria-current="page"] { background: rgba(255,255,255,.12); transform: translateY(-2px); }

      @keyframes enter { from { opacity: 0; transform: translateY(1.5rem) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes drift { to { transform: translate(2rem, 2.5rem) rotate(15deg); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>
    <main>
      <div class="eyebrow">A fresh beginning</div>
      <h1>Hello,<br />World<span class="spark">!</span></h1>
      <p>A tiny page with a little cosmic polish—ready for whatever you build next.</p>
      <nav aria-label="Main navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </main>
  </body>
</html>
